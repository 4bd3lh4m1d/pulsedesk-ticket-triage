spring:
  application:
    name: pulsedesk-ticket-triage

  datasource:
    url: jdbc:h2:mem:pulsedesk

  jpa:
    hibernate:
      ddl-auto: update

  h2:
    console:
      enabled: true
      path: /h2-console

huggingface:
  api:
    url: https://router.huggingface.co/v1/chat/completions
    token: ${HF_API_TOKEN}
    model: Qwen/Qwen3-4B-Instruct-2507:nscale
    read-timeout-ms: 180000