<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PulseDesk — Comment to Ticket Triage</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8;
    --accent: #38bdf8; --high: #ef4444; --medium: #f59e0b; --low: #22c55e;
  }
  * { box-sizing: border-box; }
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; }
  h1 { font-size: 1.5rem; margin-bottom: 0.25rem; }
  p.subtitle { color: var(--muted); margin-top: 0; }
  .layout { display: grid; grid-template-columns: 360px 1fr; gap: 2rem; max-width: 1100px; margin: 0 auto; }
  .card { background: var(--card); border-radius: 12px; padding: 1.25rem; }
  textarea, select { width: 100%; padding: 0.6rem; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: var(--text); font-family: inherit; margin-bottom: 0.75rem; }
  textarea { min-height: 100px; resize: vertical; }
  button { background: var(--accent); color: #0f172a; border: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  #status { margin-top: 0.75rem; font-size: 0.9rem; min-height: 1.2rem; }
  #status.error { color: var(--high); }
  #status.success { color: var(--low); }
  .ticket { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 1rem; margin-bottom: 0.75rem; }
  .ticket h3 { margin: 0 0 0.4rem 0; font-size: 1rem; }
  .ticket p { margin: 0.25rem 0; color: var(--muted); font-size: 0.9rem; }
  .badges { margin-bottom: 0.5rem; }
  .badge { display: inline-block; padding: 0.15rem 0.6rem; border-radius: 999px; font-size: 0.75rem; font-weight: 600; margin-right: 0.4rem; }
  .priority-HIGH { background: var(--high); color: white; }
  .priority-MEDIUM { background: var(--medium); color: #1a1a1a; }
  .priority-LOW { background: var(--low); color: #1a1a1a; }
  .category { background: #334155; color: var(--text); }
  #empty, .muted { color: var(--muted); font-size: 0.9rem; }
  .comment { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; }
  .comment p.comment-text { margin: 0.35rem 0 0.25rem 0; color: var(--text); font-size: 0.9rem; }
  .comment p.comment-meta { margin: 0; color: var(--muted); font-size: 0.75rem; }
  .status-ANALYZED { background: var(--low); color: #1a1a1a; }
  .status-ANALYSIS_FAILED { background: var(--high); color: white; }
  .status-RECEIVED { background: var(--medium); color: #1a1a1a; }
</style>
</head>
<body>
  <h1>PulseDesk</h1>
  <p class="subtitle">Comment-to-ticket triage, powered by AI</p>

  <div class="layout">
    <div class="card">
      <h2>Submit a comment</h2>
      <form id="commentForm">
        <textarea id="text" placeholder="What's the feedback?" required></textarea>
        <select id="channel">
          <option value="app_review">App review</option>
          <option value="web_form">Web form</option>
          <option value="chat_widget">Chat widget</option>
          <option value="other">Other</option>
        </select>
        <button type="submit" id="submitBtn">Submit</button>
        <div id="status"></div>
      </form>
    </div>

    <div class="card">
      <h2>Tickets</h2>
      <div id="tickets"><p id="empty">Loading...</p></div>
    </div>

    <div class="card">
      <h2>Comments</h2>
      <div id="comments"><p class="muted">Loading...</p></div>
    </div>
  </div>

<script>
  const form = document.getElementById('commentForm');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');
  const ticketsEl = document.getElementById('tickets');
  const commentsEl = document.getElementById('comments');

  async function loadComments() {
    const res = await fetch('/comments');
    const comments = await res.json();

    if (comments.length === 0) {
      commentsEl.innerHTML = '<p class="muted">No comments yet. Submit one on the left.</p>';
      return;
    }

    commentsEl.innerHTML = comments.slice().reverse().map(c => `
      <div class="comment">
        <div class="badges">
          <span class="badge status-${c.status}">${c.status.replace('_', ' ')}</span>
          <span class="badge category">${escapeHtml(c.channel || 'unknown')}</span>
        </div>
        <p class="comment-text">${escapeHtml(c.text)}</p>
        <p class="comment-meta">${new Date(c.createdAt).toLocaleString()}</p>
      </div>
    `).join('');
  }

  async function loadTickets() {
    const res = await fetch('/tickets');
    const tickets = await res.json();

    if (tickets.length === 0) {
      ticketsEl.innerHTML = '<p id="empty">No tickets yet.</p>';
      return;
    }

    ticketsEl.innerHTML = tickets.slice().reverse().map(t => `
      <div class="ticket">
        <div class="badges">
          <span class="badge priority-${t.priority}">${t.priority}</span>
          <span class="badge category">${t.category}</span>
        </div>
        <h3>${escapeHtml(t.title)}</h3>
        <p>${escapeHtml(t.summary)}</p>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    submitBtn.disabled = true;
    statusEl.textContent = 'Analyzing...';
    statusEl.className = '';

    const text = document.getElementById('text').value;
    const channel = document.getElementById('channel').value;

    try {
      const res = await fetch('/comments', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, channel })
      });
      const data = await res.json();

      if (!res.ok) {
        statusEl.textContent = data.details ? Object.values(data.details).join(', ') : data.message;
        statusEl.className = 'error';
        return;
      }

      statusEl.textContent = data.status === 'ANALYZED'
        ? 'Submitted and analyzed.'
        : 'Submitted, but analysis failed — it will need a retry.';
      statusEl.className = 'success';
      form.reset();
      await Promise.all([loadTickets(), loadComments()]);
    } catch (err) {
      statusEl.textContent = 'Network error — is the server running?';
      statusEl.className = 'error';
    } finally {
      submitBtn.disabled = false;
    }
  });

  loadTickets();
  loadComments();
</script>
</body>
</html>
